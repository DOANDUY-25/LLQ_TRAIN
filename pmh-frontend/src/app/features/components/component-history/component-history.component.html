<!-- Backdrop -->
<div class="modal-backdrop" (click)="onBack()"></div>

<!-- Modal Dialog -->
<div class="modal-dialog" role="dialog">

  <!-- Header -->
  <div class="modal-header">
    <span class="modal-title">Lịch sử thao tác cấu phần</span>
    <button class="modal-close-btn" (click)="onBack()" aria-label="Đóng">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Body -->
  <div class="modal-body">
    <tui-loader [showLoader]="loading" [overlay]="true">
      <div class="ag-grid-container" style="width: 100%; height: 380px;">
        <ag-grid-angular
          style="width: 100%; height: 100%;"
          class="ag-theme-quartz"
          [rowData]="historyLogs"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          [pagination]="false"
          (gridReady)="onGridReady($event)"
        >
        </ag-grid-angular>
      </div>
    </tui-loader>

    <!-- Pagination -->
    <div class="table-footer" *ngIf="totalElements > 0">
      <div class="pagination-info">
        Hiển thị <strong>{{ currentPage * pageSize + 1 }}</strong> –
        <strong>{{ Math.min((currentPage + 1) * pageSize, totalElements) }}</strong>
        trong tổng <strong>{{ totalElements }}</strong> bản ghi
      </div>

      <div class="pagination-controls">
        <tui-pagination
          [length]="totalPages"
          [index]="currentPage"
          (indexChange)="onPageChange($event)"
        ></tui-pagination>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="modal-footer">
    <button tuiButton appearance="secondary" size="s" (click)="onBack()">Đóng</button>
  </div>
</div>
